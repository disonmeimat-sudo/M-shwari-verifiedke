{% extends "base.html" %}

{% block title %}Admin Login — {{ app_name }}{% endblock %}

{% block content %}

<div style="max-width:420px;margin:50px auto;">

    <div class="card">

        <h2>Administrator Login</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-danger">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="mb-3">
                <label>Email or Phone</label>

                <input
                    type="text"
                    name="identifier"
                    class="form-control"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="mb-3">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                LOGIN
            </button>

        </form>

    </div>

</div>

{% endblock %}
